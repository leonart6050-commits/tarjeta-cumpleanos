<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feliz cumpleaños Mi Yeli 🎂🎉❤️</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #fff8ee;
        --soft: #ffd9e2;
        --accent: #ff8eaa;
        --deep: #170e19;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
        color: var(--ink);
        background:
          radial-gradient(circle at 25% 15%, #5c2947 0, transparent 38%),
          radial-gradient(circle at 80% 80%, #392047 0, transparent 40%),
          var(--deep);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .card {
        position: relative;
        width: min(94vw, 920px);
        padding: clamp(24px, 5vw, 52px);
        text-align: center;
        border: 2px solid rgba(255, 255, 255, 0.65);
        border-radius: 28px;
        background: rgba(17, 9, 20, 0.72);
        box-shadow:
          0 24px 80px rgba(0, 0, 0, 0.48),
          inset 0 0 40px rgba(255, 142, 170, 0.08);
        backdrop-filter: blur(10px);
        animation: arrive 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .heart {
        font-size: clamp(34px, 6vw, 64px);
        filter: drop-shadow(0 0 16px rgba(255, 142, 170, 0.75));
        animation: beat 1.15s ease-in-out infinite;
      }

      h1 {
        margin: 12px 0 8px;
        font-size: clamp(25px, 5vw, 52px);
        line-height: 1.08;
        letter-spacing: 0.04em;
      }

      .subtitle {
        margin: 0 auto 24px;
        max-width: 680px;
        color: var(--soft);
        font-size: clamp(12px, 2vw, 18px);
        line-height: 1.6;
      }

      pre {
        min-height: 9em;
        margin: 8px 0 18px;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        font:
          700 clamp(7px, 1.7vw, 17px)/1.25 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        white-space: pre;
        text-shadow: 0 0 12px rgba(255, 217, 226, 0.28);
      }

      .cat-stage { position: relative; }

      .cat-hit {
        position: absolute;
        top: 0;
        bottom: 18px;
        width: 31%;
        border: 0;
        border-radius: 18px;
        background: transparent;
        cursor: pointer;
      }

      .cat-hit.left { left: 0; }
      .cat-hit.right { right: 0; }
      .cat-hit:hover,
      .cat-hit:focus-visible { background: rgba(255, 142, 170, 0.12); }
      .cat-hit.pop { animation: cat-pop 0.42s ease; }

      .speech {
        position: absolute;
        z-index: 2;
        top: -18px;
        max-width: 44%;
        padding: 8px 12px;
        border-radius: 16px 16px 16px 4px;
        color: #3a1728;
        background: var(--ink);
        font: 700 clamp(11px, 1.8vw, 16px)/1.25 system-ui, sans-serif;
        opacity: 0;
        transform: translateY(8px) scale(0.9);
        transition: 0.2s ease;
        pointer-events: none;
      }

      .speech.right { right: 0; border-radius: 16px 16px 4px 16px; }
      .speech.show { opacity: 1; transform: none; }

      .song {
        color: var(--accent);
        font-weight: 700;
        animation: sway 1.2s ease-in-out infinite alternate;
      }

      .love {
        margin: 26px 0 0;
        font-family: Georgia, serif;
        font-size: clamp(17px, 2.7vw, 25px);
        font-style: italic;
        line-height: 1.5;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        15% {
          transform: scale(1.16);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.1);
        }
      }

      @keyframes sway {
        from {
          transform: rotate(-1deg);
        }
        to {
          transform: rotate(1deg);
        }
      }

      @keyframes cat-pop {
        50% { transform: translateY(-9px) rotate(-3deg) scale(1.06); }
      }

      @media (prefers-reduced-motion: reduce) {
        .card,
        .heart,
        .song {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="confetti" aria-hidden="true"></canvas>

    <main class="card">
      <div class="heart" aria-hidden="true">♥</div>
      <h1>¡Feliz cumpleaños, <span id="name"></span>!</h1>
      <p class="subtitle">
        Que tu día esté lleno de amor, alegría y ronroneos.
      </p>
      <div class="cat-stage">
        <pre id="dance" aria-label="Dos gatitos y una persona bailando"></pre>
        <span class="speech" id="fat-speech" role="status">¡Quiero Churu! 😸</span>
        <span class="speech right" id="cat-speech" role="status">¡Miau, te amo! ❤️</span>
        <button class="cat-hit left" id="fat-cat" type="button" aria-label="Gatito gordito: haz clic para escucharlo"></button>
        <button class="cat-hit right" id="cat" type="button" aria-label="Gatito: haz clic para escucharlo"></button>
      </div>
      <div class="song">♪ Miau, miau… ¡a bailar! ♪</div>
      <p class="love">Te amo y quiero celebrar muchos cumpleaños contigo ♥</p>
    </main>

    <script>
      // Cambia solamente este texto para personalizar el nombre.
      const NAME = "Mi Amor";

      const frames = [
        `  /\\___/\\              \\o/              /\\___/\\
 (   o o   )            █              (  o o  )
 /   ^   \\            / \\             /   ^   \\
(   \\___/   )        _/   \\_          (  \\___/  )
 /|     |\\                            /|     |\\
(_|_   _|_)                          (_|_   _|_)`,
        `  /\\___/\\              o_              /\\___/\\
 (   ^ ^   )           /█              (  ^ ^  )
 /   o   \\            / \\             /   o   \\
(   \\___/   )         /  _>           (  \\___/  )
 /|    _|\\                            /|_    |\\
(_|___/  _)                          (_  \\___|_)`,
        `  /\\___/\\             _o/              /\\___/\\
 (   o o   )            █              (  o o  )
 /   ^   \\             /\\             /   ^   \\
(   \\___/   )        _/  \\_           (  \\___/  )
 /|_    |\\                            /|    _|\\
(_  \\___|_)                          (_|___/  _)`,
        `  /\\___/\\             \\o_              /\\___/\\
 (   ^ ^   )            █\\             (  ^ ^  )
 /   o   \\             / \\            /   o   \\
(   \\___/   )         <_  \\          (  \\___/  )
 /|     |\\                            /|     |\\
(_|_   _|_)                          (_|_   _|_)`,
      ];

      document.getElementById("name").textContent = NAME;
      const dance = document.getElementById("dance");
      let frame = 0;
      dance.textContent = frames[0];
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        setInterval(
          () => (dance.textContent = frames[++frame % frames.length]),
          220,
        );
      }

      let speechTimer;
      function makeCatTalk(buttonId, speechId) {
        const button = document.getElementById(buttonId);
        const speech = document.getElementById(speechId);
        button.addEventListener("click", () => {
          document.querySelectorAll(".speech").forEach((item) => item.classList.remove("show"));
          document.querySelectorAll(".cat-hit").forEach((item) => item.classList.remove("pop"));
          clearTimeout(speechTimer);
          void button.offsetWidth;
          button.classList.add("pop");
          speech.classList.add("show");
          speechTimer = setTimeout(() => speech.classList.remove("show"), 2400);
        });
      }

      makeCatTalk("fat-cat", "fat-speech");
      makeCatTalk("cat", "cat-speech");

      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");
      const colors = ["#fff8ee", "#ffd9e2", "#ff8eaa", "#dcb8ff"];
      let pieces = [];

      function resize() {
        const scale = Math.min(devicePixelRatio || 1, 2);
        canvas.width = innerWidth * scale;
        canvas.height = innerHeight * scale;
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        pieces = Array.from(
          { length: Math.min(120, Math.floor(innerWidth / 8)) },
          () => ({
            x: Math.random() * innerWidth,
            y: Math.random() * innerHeight,
            size: 2 + Math.random() * 5,
            speed: 0.35 + Math.random() * 1.2,
            drift: -0.45 + Math.random() * 0.9,
            spin: Math.random() * Math.PI,
            color: colors[Math.floor(Math.random() * colors.length)],
          }),
        );
      }

      function drawConfetti() {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        for (const p of pieces) {
          p.y += p.speed;
          p.x += Math.sin(p.y / 35) * p.drift;
          p.spin += 0.025;
          if (p.y > innerHeight + 10) {
            p.y = -10;
            p.x = Math.random() * innerWidth;
          }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.spin);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size, -p.size / 3, p.size * 2, p.size / 1.5);
          ctx.restore();
        }
        requestAnimationFrame(drawConfetti);
      }

      addEventListener("resize", resize);
      resize();
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches)
        drawConfetti();
    </script>
  </body>
</html>
